version: "3.9"

services:
  backend1:
    build: ./backend
    container_name: backend1

  backend2:
    build: ./backend
    container_name: backend2

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend1
      - backend2